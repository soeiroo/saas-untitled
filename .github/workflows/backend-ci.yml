name: Backend CI

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache do Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            
      - name: Configurar Maven settings para Spring 4.0.1
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOL
          <settings>
            <profiles>
              <profile>
                <id>spring-milestones</id>
                <repositories>
                  <repository>
                    <id>spring-milestones</id>
                    <url>https://repo.spring.io/milestone</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>spring-milestones</activeProfile>
            </activeProfiles>
          </settings>
          EOL

      - name: Rodar testes
        run: mvn test --settings ~/.m2/settings.xml

      - name: Build com Maven
        run: mvn clean package --settings ~/.m2/settings.xml
